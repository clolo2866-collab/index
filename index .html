<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البحث في بيانات العاملين</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2433;--mu:#667085;--bd:#dfe3ea;--ac:#1f6feb;--hd:#eef3fd;--dg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#181e2a;--tx:#e8ecf3;--mu:#98a2b3;--bd:#2a3344;--ac:#5b9dff;--hd:#1e2a40;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#10141c;--card:#181e2a;--tx:#e8ecf3;--mu:#98a2b3;--bd:#2a3344;--ac:#5b9dff;--hd:#1e2a40;--dg:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:auto}
h1{font-size:1.3rem;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:200px;padding:11px 12px;font-size:1rem;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{padding:10px 16px;font-size:.95rem;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.x{background:transparent;color:var(--dg);padding:4px 8px;border:1px solid var(--bd)}
textarea{width:100%;height:150px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:.85rem}
.mu{color:var(--mu);font-size:.88rem;margin:6px 0}
.msg{color:var(--dg);font-size:.92rem;margin-top:8px;min-height:1.2em}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--bd);font-size:.93rem}
th{background:var(--hd);position:sticky;top:0}
td.n{color:var(--mu)}
.sug{display:none;margin-top:10px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;background:var(--hd);font-size:.88rem}
.sh button{padding:5px 12px;font-size:.85rem}
.sl{max-height:280px;overflow-y:auto}
.si{padding:9px 12px;border-top:1px solid var(--bd);cursor:pointer;font-size:.93rem}
.si:hover{background:var(--hd)}
.si span{color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
<h1>البحث في بيانات العاملين</h1>

<div class="card">
  <div class="row">
    <input type="text" id="q" placeholder="اكتب الاسم أو الكود ثم اضغط Enter" autocomplete="off">
    <button id="go">بحث</button>
    <button class="sec" id="clr">مسح النتائج</button>
  </div>
  <div class="sug" id="sug"><div class="sh"><b id="sc"></b><button id="sa">إضافة الكل</button></div><div class="sl" id="sl"></div></div>
  <div class="msg" id="msg"></div>
  <div class="mu" id="cnt"></div>
</div>

<div class="card tw">
  <table>
    <thead><tr><th>#</th><th>الاسم</th><th>الكود</th><th>الوظيفة</th><th>القسم</th><th>تاريخ التعيين</th><th>النوع</th><th></th></tr></thead>
    <tbody id="res"></tbody>
  </table>
  <div class="mu" id="empty">لا توجد نتائج بعد. ابحث عن اسم وسيظهر في سطر، والبحث التالي في السطر الذي بعده.</div>
</div>

</div>

function norm(s){return String(s||"").replace(/[\u064B-\u0652\u0640]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ").trim().toLowerCase();}
function fixDate(d){
  d=(d||"").trim();
  if(/^\d{5}$/.test(d)){var t=new Date(Date.UTC(1899,11,30)+(+d)*864e5);return t.toISOString().slice(0,10);}
  var m=d.match(/^(\d\d)-(\d\d)-(\d\d)$/); if(m) return "20"+m[3]+"-"+m[1]+"-"+m[2];
  return d;
}
function parse(text){
  var out=[], dept="الإدارة", lines=text.split(/\r?\n/);
  lines.forEach(function(l){
    var c=l.split("\t").map(function(x){return x.trim();});
    var sex=(c[1]||"").toLowerCase();
    if(sex==="male"||sex==="female"){
      if(!c[3]) return;
      out.push({sex:sex==="male"?"ذكر":"أنثى",code:c[2]||"",name:c[3].replace(/\s+/g," "),pos:c[4]||"",date:fixDate(c[5]),dept:dept});
      return;
    }
    var ne=c.filter(Boolean);
    if(ne.length===1 && !/^\d+$/.test(ne[0]) && ne[0]!=="Nr") dept=ne[0];
  });
  return out;
}
function load(){refresh();}
function refresh(){
  document.getElementById("cnt").textContent=DATA.length?("عدد السجلات المحملة: "+DATA.length):"";
  
}
function render(){
  var tb=document.getElementById("res"); tb.innerHTML="";
  shown.forEach(function(r,i){
    var tr=document.createElement("tr");
    [i+1,r.name,r.code,r.pos,r.dept,r.date,r.sex].forEach(function(v,k){
      var td=document.createElement("td"); td.textContent=v; if(k===0) td.className="n"; tr.appendChild(td);
    });
    var td=document.createElement("td"), b=document.createElement("button");
    b.className="x"; b.textContent="حذف"; b.onclick=function(){shown.splice(i,1);render();};
    td.appendChild(b); tr.appendChild(td); tb.appendChild(tr);
  });
  document.getElementById("empty").style.display=shown.length?"none":"block";
}
function search(){
  var q=document.getElementById("q"), msg=document.getElementById("msg");
  msg.textContent="";
  var t=norm(q.value); if(!t) return;
    var exact=DATA.filter(function(r){return norm(r.name)===t||r.code===q.value.trim();});
  var found=exact;
  if(!found.length){
    var words=t.split(" ");
    found=DATA.filter(function(r){var n=norm(r.name);return words.every(function(w){return n.indexOf(w)>-1;});});
  }
  if(!found.length){msg.textContent="لا توجد نتيجة لـ «"+q.value.trim()+"»";return;}
  found.forEach(function(r){shown.push(r);});
  if(found.length>1) msg.textContent="تمت إضافة "+found.length+" نتائج مطابقة.";
  render(); q.value=""; hideSug(); q.focus();
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
document.getElementById("go").onclick=search;
document.getElementById("q").addEventListener("keydown",function(e){if(e.key==="Enter")search();});
document.getElementById("clr").onclick=function(){shown=[];render();document.getElementById("msg").textContent="";};
var cur=[];
function matches(v){
  var t=norm(v); if(!t) return [];
  var words=t.split(" ");
  return DATA.filter(function(r){var n=norm(r.name)+" "+r.code;return words.every(function(w){return n.indexOf(w)>-1;});});
}
function hideSug(){document.getElementById("sug").style.display="none";cur=[];}
function showSug(){
  var v=document.getElementById("q").value;
  cur=matches(v);
  var box=document.getElementById("sug");
  if(!cur.length){hideSug();return;}
  document.getElementById("sc").textContent="الاقتراحات: "+cur.length;
  var sl=document.getElementById("sl"); sl.innerHTML="";
  cur.slice(0,300).forEach(function(r){
    var d=document.createElement("div"); d.className="si";
    d.appendChild(document.createTextNode(r.name+" "));
    var s=document.createElement("span"); s.textContent="— "+r.pos+(r.dept?" — "+r.dept:""); d.appendChild(s);
    d.onclick=function(){shown.push(r);render();document.getElementById("msg").textContent="";window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});};
    sl.appendChild(d);
  });
  box.style.display="block";
}
document.getElementById("q").addEventListener("input",showSug);
document.getElementById("sa").onclick=function(){
  cur.forEach(function(r){shown.push(r);});

};
